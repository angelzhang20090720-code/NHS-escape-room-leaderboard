<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHS Escape Room Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#0f0818; --night2:#1d1030; --panel:#26143d;
    --pumpkin:#ff7518; --glow:#ffa24a; --slime:#9dff3a;
    --purple:#8b3fd1; --bone:#f6eefc; --ink:#1a0b00;
    --spooky: "Creepster", "Chalkduster", "Papyrus", fantasy;
    --body: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--bone); font-family:var(--body);
    background:
      radial-gradient(ellipse at 50% -10%, #4a1d7a 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(255,117,24,.25) 0%, transparent 50%),
      linear-gradient(var(--night2), var(--night));
    background-attachment:fixed;
    overflow-x:hidden; position:relative;
  }

  /* Cobwebs */
  .web { position:fixed; top:0; width:min(220px,28vw); opacity:.55; pointer-events:none; z-index:0; }
  .web.left { left:0; }
  .web.right { right:0; transform:scaleX(-1); }

  /* Floating bats */
  .bat { position:fixed; top:-40px; font-size:1.8rem; pointer-events:none; z-index:1; animation:fly 16s linear infinite; opacity:.85; }
  .bat:nth-child(3) { animation-duration:22s; animation-delay:-6s; font-size:1.3rem; }
  .bat:nth-child(4) { animation-duration:19s; animation-delay:-12s; font-size:2.2rem; }
  @keyframes fly {
    0%   { transform:translate(-10vw, 8vh) rotate(-8deg); }
    50%  { transform:translate(50vw, 22vh) rotate(8deg); }
    100% { transform:translate(110vw, 10vh) rotate(-8deg); }
  }

  header { position:relative; z-index:2; text-align:center; padding:48px 20px 24px; }
  .moon {
    position:absolute; top:18px; left:50%; width:150px; height:150px; margin-left:-75px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff7d6, #ffd98a 60%, #e8a94a);
    box-shadow:0 0 80px 20px rgba(255,200,100,.35); opacity:.28; z-index:-1;
  }
  h1 {
    margin:0; font-family:var(--spooky); font-weight:400; letter-spacing:.04em;
    font-size:clamp(2.6rem,8vw,5.5rem); color:var(--pumpkin); line-height:1.05;
    text-shadow:0 0 12px rgba(255,117,24,.8), 0 0 40px rgba(255,117,24,.45), 3px 3px 0 #4a1d7a;
    animation:flicker 5s infinite;
  }
  @keyframes flicker { 0%,92%,100% { opacity:1; } 93% { opacity:.75; } 95% { opacity:1; } 97% { opacity:.8; } }
  .tagline { margin:10px 0 0; font-size:clamp(1rem,2.2vw,1.4rem); color:var(--slime); letter-spacing:.12em; text-transform:uppercase; text-shadow:0 0 10px rgba(157,255,58,.5); }

  main { position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:16px 16px 80px; }
  .boards { display:grid; grid-template-columns:1fr; gap:36px; }
  @media (min-width:900px) { .boards { grid-template-columns:1fr 1fr; } }

  .division h2 {
    margin:0 0 16px; padding:10px 18px; text-align:center; font-family:var(--spooky); font-weight:400;
    font-size:clamp(1.7rem,3.4vw,2.6rem); color:var(--slime); letter-spacing:.05em;
    background:linear-gradient(90deg, transparent, rgba(139,63,209,.55), transparent);
    border-top:2px dashed var(--purple); border-bottom:2px dashed var(--purple);
    text-shadow:0 0 14px rgba(157,255,58,.55);
  }

  .list { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .row {
    display:grid; grid-template-columns:54px 1fr auto; align-items:center; gap:14px;
    padding:14px 18px; font-size:clamp(1.1rem,2vw,1.5rem);
    background:linear-gradient(135deg, var(--panel), #1a0e2c);
    border:1px solid rgba(139,63,209,.5); border-left:6px solid var(--purple);
    border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  .rank {
    width:42px; height:42px; display:grid; place-items:center; border-radius:50%;
    font-family:var(--spooky); font-size:1.5rem; color:var(--bone);
    background:rgba(139,63,209,.4); border:2px solid var(--purple);
  }
  .name { font-weight:700; overflow-wrap:anywhere; }
  .time { font-variant-numeric:tabular-nums; font-weight:700; color:var(--glow); font-size:1.1em; letter-spacing:.04em; }

  .row.winner {
    grid-template-columns:64px 1fr auto;
    padding:24px 22px; font-size:clamp(1.4rem,2.8vw,2.1rem);
    background:linear-gradient(135deg, #ff7518, #ffb347);
    color:var(--ink); border:3px solid #ffe3b0; border-left-width:3px; border-radius:18px;
    box-shadow:0 0 0 3px var(--pumpkin), 0 0 34px 6px rgba(255,117,24,.65);
    animation:pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow:0 0 0 3px var(--pumpkin), 0 0 54px 14px rgba(255,117,24,.85); } }
  .row.winner .rank { background:var(--ink); color:var(--glow); border-color:var(--ink); width:50px; height:50px; font-size:1.8rem; }
  .row.winner .time { color:var(--ink); }
  .badge {
    display:inline-block; margin-left:10px; padding:3px 12px; border-radius:999px; vertical-align:middle;
    background:var(--ink); color:var(--slime); font-family:var(--spooky); font-weight:400;
    font-size:.6em; letter-spacing:.08em;
  }

  .row.fresh { animation:appear 1.8s ease-out; }
  .row.winner.fresh { animation:pulse 2.8s ease-in-out infinite, appear 1.8s ease-out; }
  @keyframes appear { from { transform:scale(.96); outline:3px solid var(--slime); } }

  .empty {
    padding:30px; text-align:center; font-size:1.2rem; color:#cdb8e6;
    border:2px dashed var(--purple); border-radius:14px; background:rgba(38,20,61,.6);
  }
  #status { text-align:center; margin-top:24px; color:#cdb8e6; }

  /* Fog */
  .fog { position:fixed; left:0; right:0; bottom:0; height:90px; pointer-events:none; z-index:3;
         background:linear-gradient(transparent, rgba(139,63,209,.28)); }
  .tombs { position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:1.7rem; letter-spacing:1.5rem; pointer-events:none; z-index:4; opacity:.7; white-space:nowrap; overflow:hidden; }

  @media (prefers-reduced-motion:reduce) {
    .bat, h1, .row.winner, .row.fresh { animation:none !important; }
  }
</style>
</head>
<body>

<svg class="web left" viewBox="0 0 200 200" fill="none" stroke="#d9c8f0" stroke-width="1.2" aria-hidden="true">
  <path d="M0 0 L200 0 M0 0 L190 70 M0 0 L150 150 M0 0 L70 190 M0 0 L0 200"/>
  <path d="M40 0 Q35 30 0 40 M80 0 Q70 60 0 80 M120 0 Q105 90 0 120 M160 0 Q140 120 0 160"/>
</svg>
<svg class="web right" viewBox="0 0 200 200" fill="none" stroke="#d9c8f0" stroke-width="1.2" aria-hidden="true">
  <path d="M0 0 L200 0 M0 0 L190 70 M0 0 L150 150 M0 0 L70 190 M0 0 L0 200"/>
  <path d="M40 0 Q35 30 0 40 M80 0 Q70 60 0 80 M120 0 Q105 90 0 120 M160 0 Q140 120 0 160"/>
</svg>

<div class="bat" aria-hidden="true">🦇</div>
<div class="bat" aria-hidden="true">🦇</div>
<div class="bat" aria-hidden="true">🦇</div>

<header>
  <div class="moon" aria-hidden="true"></div>
  <h1>🎃 NHS Escape Room 🎃</h1>
  <p class="tagline">Leaderboard &middot; Fastest escape lives to tell the tale</p>
</header>

<main>
  <div class="boards">
    <section class="division" aria-labelledby="hsTitle">
      <h2 id="hsTitle">👻 High School (HS) 👻</h2>
      <ol id="board-HS" class="list" aria-live="polite"><li class="empty">Summoning results...</li></ol>
    </section>
    <section class="division" aria-labelledby="msTitle">
      <h2 id="msTitle">🕷️ Middle School (MS) 🕷️</h2>
      <ol id="board-MS" class="list" aria-live="polite"><li class="empty">Summoning results...</li></ol>
    </section>
  </div>
  <p id="status"></p>
</main>

<div class="fog" aria-hidden="true"></div>
<div class="tombs" aria-hidden="true">🪦 🎃 🪦 🕸️ 🪦 🎃 🪦 🕸️ 🪦 🎃 🪦 🕸️ 🪦 🎃 🪦</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDx3B0-yMdfhg7sRWwaelhYCfbcM-q-eDA",
    authDomain: "nhs-escape-room.firebaseapp.com",
    databaseURL: "https://nhs-escape-room-default-rtdb.firebaseio.com",
    projectId: "nhs-escape-room",
    storageBucket: "nhs-escape-room.firebasestorage.app",
    messagingSenderId: "734297932008",
    appId: "1:734297932008:web:827f05d36cbdd9982c895d"
  };

  const status = document.getElementById("status");
  const lastIds = { HS: new Set(), MS: new Set() };

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };

  function renderDivision(div, all) {
    const board = document.getElementById("board-" + div);
    const results = all.filter(r => r.division === div)
      .sort((a, b) => a.seconds - b.seconds || a.added - b.added);

    if (!results.length) {
      board.innerHTML = '<li class="empty">No survivors yet... 💀</li>';
      lastIds[div] = new Set();
      return;
    }
    const best = results[0].seconds;
    let rank = 0, prev = null;
    board.innerHTML = results.map((r, i) => {
      if (r.seconds !== prev) { rank = i + 1; prev = r.seconds; }
      const win = r.seconds === best;
      const fresh = lastIds[div].size && !lastIds[div].has(r.id) ? " fresh" : "";
      return `<li class="row${win ? " winner" : ""}${fresh}">
        <span class="rank">${rank}</span>
        <span class="name">${esc(r.name)}${win ? '<span class="badge">🎃 WINNER</span>' : ""}</span>
        <span class="time">${fmt(r.seconds)}</span></li>`;
    }).join("");
    lastIds[div] = new Set(results.map(r => r.id));
  }

  function render(data) {
    const all = Object.entries(data || {}).map(([id, r]) => ({ id, ...r }));
    renderDivision("HS", all);
    renderDivision("MS", all);
  }

  try {
    const db = getDatabase(initializeApp(firebaseConfig));
    onValue(ref(db, "results"), snap => { status.textContent = ""; render(snap.val()); },
      () => { status.textContent = "The spirits can't be reached. Check your connection and refresh."; });
  } catch (e) {
    status.textContent = "Leaderboard is not set up yet.";
  }
</script>
</body>
</html>
